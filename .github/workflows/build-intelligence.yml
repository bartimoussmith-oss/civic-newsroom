name: build-intelligence
# Tests only. Building and publishing the real-corpus intelligence moved to the dedicated host
# bartimoussmith-oss/civic-newsroom-intelligence-001 (512 MiB budget; see its README). Packaged output
# (~494 MB) cannot fit this repository's 256 MiB budget, so this workflow no longer publishes here.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["intelligence/**", ".github/workflows/build-intelligence.yml"]
permissions:
  contents: read
concurrency:
  group: build-intelligence
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/checkout@v4
        with:
          repository: bartimoussmith-oss/civic-newsroom-data-001
          path: source-data
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /published.json
            /datasets/
      - name: Test retrieval and lossless file reconstruction
        run: |
          python -m unittest discover -s intelligence -p 'test_*.py' -v
          node --check web/intelligence-tools.js
