name: build-report
on:
  push:
    branches: [main]
    paths: [".github/workflows/build-report.yml"]
  workflow_run:
    workflows: ["build-public-data"]
    types: [completed]
    branches: [main]
permissions:
  contents: write
  actions: read
concurrency:
  group: newsroom-build-report
  cancel-in-progress: false
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const owner='bartimoussmith-oss',repo='civic-newsroom';
            const fs=require('fs'),os=require('os'),path=require('path'),cp=require('child_process');
            let run=context.payload.workflow_run;
            if(!run){
              const result=await github.rest.actions.listWorkflowRuns({owner,repo,workflow_id:'build-public-data.yml',branch:'main',per_page:1});
              run=result.data.workflow_runs[0];
            }
            if(!run)throw Error('No data build found');
            if(run.head_repository.full_name!==owner+'/'+repo||run.head_branch!=='main')throw Error('Unexpected report target');
            const report={schema:'newsroom-build-report-v1',repository:owner+'/'+repo,run_id:run.id,revision:run.head_sha,status:run.status,conclusion:run.conclusion||null,run_url:run.html_url,checked_at:new Date().toISOString(),dataset:null,failed_steps:[],publication_status:'not_established_by_build_report'};
            const jobs=await github.paginate(github.rest.actions.listJobsForWorkflowRun,{owner,repo,run_id:run.id,per_page:100});
            report.failed_steps=jobs.filter(j=>j.conclusion==='failure').map(j=>({job:j.name,steps:(j.steps||[]).filter(s=>s.conclusion==='failure').map(s=>s.name)}));
            if(run.conclusion==='success'){
              const artifacts=await github.paginate(github.rest.actions.listWorkflowRunArtifacts,{owner,repo,run_id:run.id,per_page:100});
              const artifact=artifacts.find(a=>a.name==='collection-manifest-'+run.head_sha&&!a.expired);
              if(!artifact)throw Error('Successful run has no collection manifest artifact');
              const response=await github.rest.actions.downloadArtifact({owner,repo,artifact_id:artifact.id,archive_format:'zip'});
              const dir=fs.mkdtempSync(path.join(os.tmpdir(),'newsroom-report-')),file=path.join(dir,'manifest.zip');
              fs.writeFileSync(file,Buffer.from(response.data));
              const code='import json,sys,zipfile; z=zipfile.ZipFile(sys.argv[1]); names=[n for n in z.namelist() if n=="collection.json"]; assert len(names)==1; info=z.getinfo(names[0]); assert info.file_size<16*1024*1024; data=json.loads(z.read(names[0])); print(json.dumps(data))';
              const manifest=JSON.parse(cp.execFileSync('python3',['-c',code,file],{encoding:'utf8',maxBuffer:16*1024*1024}));
              if(manifest.schema!=='civic-data-collection-v1')throw Error('Unexpected collection schema');
              const number=x=>Number.isSafeInteger(x)&&x>=0?x:null;
              report.dataset={schema:manifest.schema,producer_revision:manifest.producer_revision,records:number(manifest.records),input_representation_bytes:number(manifest.input_representation_bytes),stored_unique_blob_bytes:number(manifest.stored_unique_blob_bytes),unique_blobs:number(manifest.unique_blobs),excluded_count:Array.isArray(manifest.excluded)?manifest.excluded.length:null,full_historical_coverage:false,data_hosts:[],catalogs:(manifest.catalogs||[]).map(c=>({path:/^catalog-[0-9]+[.]json$/.test(c.path)?c.path:null,bytes:number(c.bytes),records:number(c.records),sha256:/^[a-f0-9]{64}$/.test(c.sha256)?c.sha256:null})),partitions:(manifest.partitions||[]).map(p=>({id:/^partition-[0-9]+$/.test(p.id)?p.id:null,payload_bytes:number(p.payload_bytes),total_bytes:number(p.total_bytes),blob_count:number(p.blob_count)}))};
              fs.rmSync(dir,{recursive:true,force:true});
            }
            const target='status/latest-build.json';
            let previous;
            try{previous=await github.rest.repos.getContent({owner,repo,path:target,ref:'main'});}catch(e){if(e.status!==404)throw e;}
            if(previous){
              const old=JSON.parse(Buffer.from(previous.data.content,'base64').toString('utf8'));
              if(old.run_id>run.id)return;
            }
            await github.rest.repos.createOrUpdateFileContents({owner,repo,path:target,branch:'main',message:'status: public data build '+run.id,content:Buffer.from(JSON.stringify(report,null,2)).toString('base64'),...(previous?{sha:previous.data.sha}:{})});
