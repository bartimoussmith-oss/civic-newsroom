name: intelligence-review
on:
  push:
    branches: [main]
    paths: ["web/intelligence*", ".github/workflows/intelligence-review.yml"]
  workflow_run:
    workflows: ["build-intelligence"]
    types: [completed]
    branches: [main]
permissions:
  contents: write
  actions: read
  checks: read
concurrency:
  group: intelligence-review
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check browser intelligence syntax
        run: node --check web/intelligence-tools.js
      - name: Persist actual intelligence build results
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const owner='bartimoussmith-oss',repo='civic-newsroom';
            let run=context.payload.workflow_run;
            if(!run){const r=await github.rest.actions.listWorkflowRuns({owner,repo,workflow_id:'build-intelligence.yml',branch:'main',per_page:1});run=r.data.workflow_runs[0];}
            if(!run||run.head_repository.full_name!==owner+'/'+repo||run.head_branch!=='main')throw Error('Unexpected diagnostic target');
            const jobs=await github.paginate(github.rest.actions.listJobsForWorkflowRun,{owner,repo,run_id:run.id,per_page:100});
            const failures=[];
            for(const j of jobs.filter(j=>j.conclusion==='failure')){
              const item={job:j.name,url:j.html_url,steps:(j.steps||[]).filter(s=>s.conclusion==='failure').map(s=>s.name),annotations:[]};
              if(j.check_run_url){const check_run_id=Number(j.check_run_url.split('/').pop());const annotations=await github.paginate(github.rest.checks.listAnnotations,{owner,repo,check_run_id,per_page:100});item.annotations=annotations.slice(0,10).map(a=>({path:a.path,line:a.start_line,message:String(a.message||'').replace(/(?:github_pat_|ghp_)[A-Za-z0-9_]+/g,'[REDACTED]').slice(0,1500)}));}
              failures.push(item);
            }
            let published=null;
            try{const p=await github.rest.repos.getContent({owner,repo,path:'intelligence-publication.json',ref:'main'});published=JSON.parse(Buffer.from(p.data.content,'base64').toString('utf8'));}catch(e){if(e.status!==404)throw e;}
            const report={schema:'intelligence-build-review-v1',run_id:run.id,revision:run.head_sha,status:run.status,conclusion:run.conclusion||null,run_url:run.html_url,checked_at:new Date().toISOString(),publication:published,failures,browser_scope:'Syntax check only; not a browser interaction or factual accuracy certification'};
            const path='status/intelligence.json';let old;
            try{old=await github.rest.repos.getContent({owner,repo,path,ref:'main'});}catch(e){if(e.status!==404)throw e;}
            if(old){const p=JSON.parse(Buffer.from(old.data.content,'base64').toString('utf8'));if(p.run_id>run.id)return;}
            await github.rest.repos.createOrUpdateFileContents({owner,repo,path,branch:'main',message:'status: intelligence build '+run.id,content:Buffer.from(JSON.stringify(report,null,2)).toString('base64'),...(old?{sha:old.data.sha}:{})});
