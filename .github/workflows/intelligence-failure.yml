name: intelligence-failure
on:
  push:
    branches: [main]
    paths: [".github/workflows/intelligence-failure.yml"]
  workflow_run:
    workflows: [build-intelligence]
    types: [completed]
permissions:
  contents: write
  actions: read
concurrency:
  group: intelligence-error-report
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const owner='bartimoussmith-oss',repo='civic-newsroom';
            const event=context.payload.workflow_run;
            const run_id=event?event.id:40293851464;
            const run=await github.rest.actions.getWorkflowRun({owner,repo,run_id});
            if(run.data.head_repository.full_name!==owner+'/'+repo||run.data.head_branch!=='main'||run.data.path!=='.github/workflows/build-intelligence.yml')throw Error('Unexpected diagnostic target');
            if(!event&&run.data.head_sha!=='18efc5218131792fb311493d4678b700c4d8d71a')throw Error('Unexpected repair revision');
            const jobs=await github.paginate(github.rest.actions.listJobsForWorkflowRun,{owner,repo,run_id,per_page:100});
            const failures=[];
            for(const job of jobs.filter(j=>j.conclusion==='failure')){
              const item={job:job.name,job_id:job.id,failed_steps:(job.steps||[]).filter(s=>s.conclusion==='failure').map(s=>s.name),exception_lines:[]};
              try{
                const response=await github.request('GET /repos/{owner}/{repo}/actions/jobs/{job_id}/logs',{owner,repo,job_id:job.id});
                let text;
                if(response.status===302&&response.headers.location){
                  const result=await fetch(response.headers.location);
                  if(!result.ok)throw Error('Log download failed');
                  text=await result.text();
                }else{text=typeof response.data==='string'?response.data:Buffer.from(response.data).toString('utf8');}
                const matches=text.match(/(?:^|\s)(?:ValueError|TypeError|KeyError|AttributeError|AssertionError|sqlite3[.][A-Za-z]+Error|MemoryError|OSError|RuntimeError|FileNotFoundError):[^\r\n]*/gm)||[];
                item.exception_lines=matches.slice(-5).map(s=>s.trim().replace(/(?:github_pat_|ghp_)[A-Za-z0-9_]+/g,'[REDACTED]').slice(0,1800));
                item.diagnostic_status=matches.length?'exception_lines_retrieved':'no_recognized_terminal_exception';
              }catch(e){item.diagnostic_status='log_access_failed';item.http_status=Number.isInteger(e.status)?e.status:null;}
              failures.push(item);
            }
            const report={schema:'intelligence-terminal-error-v2',run_id,revision:run.data.head_sha,conclusion:run.data.conclusion,checked_at:new Date().toISOString(),failures,note:'Bounded terminal exception lines only; no raw logs. A passing diagnostic is not a successful intelligence build.'};
            const path='status/intelligence-error.json';let old;
            try{old=await github.rest.repos.getContent({owner,repo,path,ref:'main'});}catch(e){if(e.status!==404)throw e;}
            if(old){const previous=JSON.parse(Buffer.from(old.data.content,'base64').toString('utf8'));if(previous.run_id>run_id){core.info('Keeping newer diagnostic');return;}}
            await github.rest.repos.createOrUpdateFileContents({owner,repo,path,branch:'main',message:'status: intelligence terminal result '+run_id,content:Buffer.from(JSON.stringify(report,null,2)).toString('base64'),...(old?{sha:old.data.sha}:{})});
