name: intelligence-failure
on:
  push:
    branches: [main]
    paths: [".github/workflows/intelligence-failure.yml"]
permissions:
  contents: write
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const owner='bartimoussmith-oss',repo='civic-newsroom',run_id=40286406710;
            const expected='f9a9a8e4ea112b965bec8b63a1e50f1b7cb3b462';
            const run=await github.rest.actions.getWorkflowRun({owner,repo,run_id});
            if(run.data.head_sha!==expected||run.data.head_repository.full_name!==owner+'/'+repo)throw Error('Unexpected diagnostic target');
            const jobs=await github.paginate(github.rest.actions.listJobsForWorkflowRun,{owner,repo,run_id,per_page:100});
            const failures=[];
            for(const job of jobs.filter(j=>j.conclusion==='failure')){
              const item={job:job.name,job_id:job.id,failed_steps:(job.steps||[]).filter(s=>s.conclusion==='failure').map(s=>s.name),exception_lines:[]};
              try{
                const response=await github.request('GET /repos/{owner}/{repo}/actions/jobs/{job_id}/logs',{owner,repo,job_id:job.id});
                let text;
                if(response.status===302&&response.headers.location){
                  const result=await fetch(response.headers.location);
                  if(!result.ok)throw Error('Log download failed');
                  text=await result.text();
                }else{text=typeof response.data==='string'?response.data:Buffer.from(response.data).toString('utf8');}
                const matches=text.match(/(?:^|\s)(?:ValueError|AssertionError|sqlite3[.][A-Za-z]+Error|MemoryError|OSError|RuntimeError|FileNotFoundError):[^\r\n]*/gm)||[];
                item.exception_lines=matches.slice(-5).map(s=>s.trim().replace(/(?:github_pat_|ghp_)[A-Za-z0-9_]+/g,'[REDACTED]').slice(0,1200));
                item.diagnostic_status=matches.length?'exception_lines_retrieved':'no_recognized_terminal_exception';
              }catch(e){item.diagnostic_status='log_access_failed';item.http_status=Number.isInteger(e.status)?e.status:null;}
              failures.push(item);
            }
            const report={schema:'intelligence-terminal-error-v1',run_id,revision:expected,conclusion:run.data.conclusion,checked_at:new Date().toISOString(),failures,note:'Bounded terminal exception lines only; no raw logs or source-record content. Root cause must be checked against code before repair.'};
            const path='status/intelligence-error.json';let old;
            try{old=await github.rest.repos.getContent({owner,repo,path,ref:'main'});}catch(e){if(e.status!==404)throw e;}
            await github.rest.repos.createOrUpdateFileContents({owner,repo,path,branch:'main',message:'status: exact intelligence error '+run_id,content:Buffer.from(JSON.stringify(report,null,2)).toString('base64'),...(old?{sha:old.data.sha}:{})});
